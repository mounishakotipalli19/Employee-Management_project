<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>employee management</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family:arial,sans-serif;
        }
        /*navbar*/
        .navbar{
            background-color: rgb(250, 215, 224);
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }
        /*navigation*/
        .nav-links{
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }
        .nav-links a:hover{
            color: aqua;
        }
        /*login.btn*/
        .login-btn{
            border: 1px solid #00bcd4;
            padding: 8px 15px;
            border-radius:5px;
        }
        .login-btn:hover{
            background-color: #00bcd4;
            color:white !important;
         }
        /*register button*/
        .register-btn{
            background-color: #00bcd4;
            padding:8px 15px;
            border-radius: 5px;
        } 
        .register-button:hover{
            background-color: #0097a7;
            color:white !important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align: center;
        }
        .theme-buttons{
            display: flex;
            gap: 10px;
            margin-right: 20px;
        }
        /*------theme buttons-----*/
        .theme-buttons a{
            color: white;
            text-decoration: none;
            border: 1px solid #00bcd4;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }
        /*---light mode------*/
        body.light{
            background-color: #f5f5f5;
            color: #222;
        }
        body.light.content{
            background-color: white;
            color: #222;
        }
        body.light.content h1{
            color:#222;
        }
        body.light.content p{
            color: #555;
        }
        /*----dark mode----*/
        body.dark{
            background-color: #f5f5f5;
            color:#222;
        }
        body.dark.content{
            background-color: #f5f5f5;
            color: #222;
        }
        body.dark.content h1{
            background-color: #1e1e1e;
            color:#222;
        }
        body.dark.content p{
            content:#555;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            employee management system
        </div>
        <div class="theme-buttons">
            <a href="/set-theme/light">light </a>
            <a href="/set-theme/dark">dark</a>
        </div>
        <ul class="nav-links">
         <li>
            <a href="/home">
              home
            </a>
         </li>
          <li>
            <a href="/employees">
              employee
            </a>
        </li>
         <li>
            <a href="/addemployee">
              addemployee
            </a>
         </li>
          <li>
            <a href="/search">
              search
            </a>
         </li>
          <li>
            <a href="/registerdemo">
              <button class="register-btn" type="submit">register</button>
            </a>
         </li>
         <li>
            <a href="/login">
              <button class="login-btn" type="submit">login</button>
            </a>
         </li>

        </ul>
    </nav>
    <div class="content">
        <h1> welcome to employee management system</h1>
        <p>manage your employee easely</p>
    </div>
</body>
</html>
